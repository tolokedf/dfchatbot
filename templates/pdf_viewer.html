<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DF Chatbot — PDF Page Citation Viewer - {{ filename }}</title>
    <link rel="icon" type="image/png" href="/static/df_logo_badge.png">
    
    <!-- Theme Pre-loader: Instant detection prevents flash of wrong theme -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('df_theme_mode') || 'dark';
                let effectiveTheme = savedTheme;
                if (savedTheme === 'system') {
                    effectiveTheme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                }
                if (effectiveTheme === 'dark') {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('light');
                } else {
                    document.documentElement.classList.add('light');
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        df: {
                            500: '#00b5b8',
                            600: '#00979b',
                            700: '#00787c'
                        },
                        slate: {
                            850: '#151f32',
                            950: '#070b14'
                        }
                    },
                    screens: {
                        'xs': '480px'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f0f7fc] dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col h-full overflow-hidden font-sans antialiased transition-colors duration-200">

    <!-- Top Navigation Toolbar -->
    <header class="h-14 sm:h-16 bg-white/95 dark:bg-slate-900/90 border-b border-sky-100 dark:border-slate-800 flex items-center justify-between px-3 sm:px-6 shrink-0 z-10 shadow-sm transition-colors duration-200">
        <!-- Manual Title & Badge -->
        <div class="flex items-center space-x-2.5 min-w-0">
            <div class="w-8 h-8 rounded-lg bg-[#00b5b8] p-1.5 flex items-center justify-center shadow-md shadow-[#00b5b8]/20 shrink-0">
                <img src="/static/df_logo_white.png" alt="DF" class="w-full h-full object-contain">
            </div>
            <div class="min-w-0">
                <h1 class="text-xs sm:text-sm font-bold text-slate-900 dark:text-slate-100 truncate" id="docTitle" title="{{ filename }}">{{ filename }}</h1>
                <p class="text-[11px] text-[#00787c] dark:text-[#38f2f5] font-bold font-mono truncate">
                    Cited Reference • Page <span id="headerPageNum" class="font-extrabold">{{ page_number }}</span> of <span id="headerTotalPages">{{ total_pages }}</span>
                </p>
            </div>
        </div>

        <!-- Page Navigator Controls -->
        <div class="flex items-center space-x-1.5 sm:space-x-3">
            <button onclick="prevPage()" id="prevBtn" class="p-2 rounded-lg bg-[#f0f7fc] dark:bg-slate-850 hover:bg-sky-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white border border-sky-200 dark:border-slate-700 transition disabled:opacity-30 disabled:cursor-not-allowed text-xs font-bold flex items-center gap-1 shadow-sm">
                <i class="fa-solid fa-chevron-left"></i>
                <span class="hidden sm:inline">Prev</span>
            </button>

            <div class="flex items-center space-x-1 text-xs font-semibold">
                <span class="text-slate-500 dark:text-slate-400 hidden xs:inline">Page</span>
                <input type="number" id="pageInput" min="1" max="{{ total_pages }}" value="{{ page_number }}" 
                       onchange="goToPage(this.value)" onkeydown="if(event.key==='Enter') goToPage(this.value)"
                       class="w-14 bg-white dark:bg-slate-950 border border-sky-200 dark:border-slate-700 rounded-md px-2 py-1 text-center font-mono font-bold text-[#00787c] dark:text-[#38f2f5] text-xs focus:outline-none focus:border-[#00b5b8] shadow-inner">
                <span class="text-slate-500 dark:text-slate-400">/ {{ total_pages }}</span>
            </div>

            <button onclick="nextPage()" id="nextBtn" class="p-2 rounded-lg bg-[#f0f7fc] dark:bg-slate-850 hover:bg-sky-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white border border-sky-200 dark:border-slate-700 transition disabled:opacity-30 disabled:cursor-not-allowed text-xs font-bold flex items-center gap-1 shadow-sm">
                <span class="hidden sm:inline">Next</span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <!-- Right Actions: Zoom & Theme & Full PDF Link -->
        <div class="flex items-center space-x-1.5 sm:space-x-2">
            <button onclick="zoomOut()" class="p-2 rounded-lg bg-[#f0f7fc] dark:bg-slate-850 hover:bg-sky-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white border border-sky-200 dark:border-slate-700 transition text-xs shadow-sm" title="Zoom Out">
                <i class="fa-solid fa-magnifying-glass-minus"></i>
            </button>
            <button onclick="resetZoom()" class="p-2 rounded-lg bg-[#f0f7fc] dark:bg-slate-850 hover:bg-sky-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white border border-sky-200 dark:border-slate-700 transition text-xs shadow-sm" title="Reset Zoom">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
            <button onclick="zoomIn()" class="p-2 rounded-lg bg-[#f0f7fc] dark:bg-slate-850 hover:bg-sky-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white border border-sky-200 dark:border-slate-700 transition text-xs shadow-sm" title="Zoom In">
                <i class="fa-solid fa-magnifying-glass-plus"></i>
            </button>
            
            <!-- Quick Theme Cycle Button -->
            <button type="button" onclick="cycleViewerTheme()" id="viewerThemeBtn" 
                    class="p-2 rounded-lg bg-[#f0f7fc] dark:bg-slate-850 hover:bg-sky-100 dark:hover:bg-slate-800 border border-sky-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 transition text-xs shadow-sm" title="Switch Theme">
                <i id="viewerThemeIcon" class="fa-solid fa-moon text-xs text-[#00b5b8]"></i>
            </button>

            <a href="/api/pdf/raw/{{ filename }}#page={{ page_number }}" target="_blank" class="px-3.5 py-1.5 rounded-lg bg-[#00b5b8] hover:bg-[#00979b] text-white text-xs font-bold transition flex items-center gap-1.5 shadow-md shadow-[#00b5b8]/20" title="Open Native PDF in Browser">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                <span class="hidden md:inline">Native PDF</span>
            </a>
        </div>
    </header>

    <!-- Main Canvas / Image Page Viewer -->
    <main class="flex-1 overflow-auto bg-[#f0f7fc] dark:bg-slate-950 p-4 sm:p-6 flex items-center justify-center select-none transition-colors duration-200" id="viewerContainer">
        <div id="pageCardWrapper" class="transition-transform duration-150 ease-out origin-center flex flex-col items-center">
            <!-- High-Res Page Image -->
            <img id="pageImg" src="{{ image_url }}" alt="Page {{ page_number }}" 
                 class="max-h-[85vh] max-w-[95vw] object-contain rounded-xl shadow-2xl border border-sky-200 dark:border-slate-800 bg-white"
                 onload="handleImageLoaded()" onerror="handleImageError()">
            
            <div id="imgLoadingPlaceholder" class="hidden py-32 text-center text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-[#00b5b8] mb-3 block"></i>
                <span class="font-bold">Loading Page Image...</span>
            </div>
        </div>
    </main>

    <!-- Footer Status -->
    <footer class="h-8 bg-white dark:bg-slate-900 border-t border-sky-100 dark:border-slate-800 px-4 flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400 font-medium shrink-0 transition-colors duration-200">
        <span>📖 NavWiz & DFleet Multimodal RAG Grounding</span>
        <span>Use <kbd class="px-1 py-0.5 rounded bg-sky-100 dark:bg-slate-800 border border-sky-200 dark:border-slate-700 font-mono text-[10px] text-slate-700 dark:text-slate-300">←</kbd> and <kbd class="px-1 py-0.5 rounded bg-sky-100 dark:bg-slate-800 border border-sky-200 dark:border-slate-700 font-mono text-[10px] text-slate-700 dark:text-slate-300">→</kbd> arrow keys to turn pages</span>
    </footer>

    <script>
        const filename = "{{ filename }}";
        const pdfStem = "{{ stem }}";
        const totalPages = parseInt("{{ total_pages }}") || 1;
        let currentPage = parseInt("{{ page_number }}") || 1;
        let currentZoom = 1.0;

        function getSystemTheme() {
            return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }

        function applyViewerTheme(mode) {
            localStorage.setItem('df_theme_mode', mode);
            let effective = mode;
            if (mode === 'system') effective = getSystemTheme();

            if (effective === 'dark') {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
            } else {
                document.documentElement.classList.add('light');
                document.documentElement.classList.remove('dark');
            }

            const icon = document.getElementById('viewerThemeIcon');
            if (icon) {
                if (mode === 'system') {
                    icon.className = 'fa-solid fa-laptop text-xs text-[#00b5b8]';
                } else if (effective === 'dark') {
                    icon.className = 'fa-solid fa-moon text-xs text-[#00b5b8]';
                } else {
                    icon.className = 'fa-solid fa-sun text-xs text-amber-500';
                }
            }
        }

        function cycleViewerTheme() {
            const current = localStorage.getItem('df_theme_mode') || 'dark';
            const modes = ['dark', 'light', 'system'];
            const next = modes[(modes.indexOf(current) + 1) % modes.length];
            applyViewerTheme(next);
        }

        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if ((localStorage.getItem('df_theme_mode') || 'dark') === 'system') {
                    applyViewerTheme('system');
                }
            });
        }

        function updateUI() {
            applyViewerTheme(localStorage.getItem('df_theme_mode') || 'dark');
            document.getElementById("headerPageNum").textContent = currentPage;
            document.getElementById("pageInput").value = currentPage;
            document.getElementById("prevBtn").disabled = (currentPage <= 1);
            document.getElementById("nextBtn").disabled = (currentPage >= totalPages);

            const padded = String(currentPage).padStart(3, '0');
            const newImgUrl = `/rendered_pages/${encodeURIComponent(pdfStem)}_page_${padded}.png`;
            
            const imgEl = document.getElementById("pageImg");
            imgEl.src = newImgUrl;
            imgEl.alt = `Page ${currentPage}`;

            // Update URL query parameters without reloading
            const url = new URL(window.location);
            url.searchParams.set('page', currentPage);
            window.history.replaceState({}, '', url);
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                updateUI();
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                updateUI();
            }
        }

        function goToPage(val) {
            let p = parseInt(val);
            if (isNaN(p)) return;
            if (p < 1) p = 1;
            if (p > totalPages) p = totalPages;
            currentPage = p;
            updateUI();
        }

        function zoomIn() {
            if (currentZoom < 2.5) {
                currentZoom += 0.2;
                applyZoom();
            }
        }

        function zoomOut() {
            if (currentZoom > 0.5) {
                currentZoom -= 0.2;
                applyZoom();
            }
        }

        function resetZoom() {
            currentZoom = 1.0;
            applyZoom();
        }

        function applyZoom() {
            document.getElementById("pageCardWrapper").style.transform = `scale(${currentZoom})`;
        }

        function handleImageLoaded() {
            document.getElementById("imgLoadingPlaceholder").classList.add("hidden");
            document.getElementById("pageImg").classList.remove("hidden");
        }

        function handleImageError() {
            document.getElementById("imgLoadingPlaceholder").innerHTML = `
                <div class="p-6 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 max-w-md mx-auto">
                    <i class="fa-solid fa-triangle-exclamation text-amber-400 text-2xl mb-2 block"></i>
                    <p class="font-bold text-sm text-slate-100">Page image preview not cached.</p>
                    <p class="text-xs text-slate-400 mt-1 mb-3">You can view the full PDF directly in browser.</p>
                    <a href="/api/pdf/raw/${encodeURIComponent(filename)}#page=${currentPage}" target="_blank" class="inline-block px-3 py-1.5 rounded-lg bg-[#00b5b8] hover:bg-[#00979b] text-white text-xs font-semibold shadow-md shadow-[#00b5b8]/20 transition">
                        Open Native PDF at Page ${currentPage}
                    </a>
                </div>
            `;
            document.getElementById("imgLoadingPlaceholder").classList.remove("hidden");
            document.getElementById("pageImg").classList.add("hidden");
        }

        // Keyboard arrow navigation
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowLeft') prevPage();
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === '+' || e.key === '=') zoomIn();
            if (e.key === '-') zoomOut();
            if (e.key === '0') resetZoom();
        });

        // Initialize button states
        updateUI();
    </script>
</body>
</html>
